name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix whatsapp-bridge install --omit=dev
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: AakalanAgy-Windows-Installer
          path: release/AakalanAgy-Setup-*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AakalanAgy-Setup-*.exe
